# =============================================================================
# Ansible configuration
# All host IPs, user, and SSH key are defined in group_vars/all.yml.
# inventory.ini is auto-generated — run ./generate-inventory.sh to rebuild it.
# =============================================================================

[defaults]
inventory          = inventory.ini
roles_path         = roles
remote_user        = user
host_key_checking  = False
timeout            = 60
forks              = 5
stdout_callback    = default
result_format      = yaml

[privilege_escalation]
become          = True
become_method   = sudo
become_user     = root
become_ask_pass = False

[ssh_connection]
ssh_args   = -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ServerAliveInterval=15 -o ServerAliveCountMax=5 -o ConnectTimeout=30
retries    = 3
pipelining = False
