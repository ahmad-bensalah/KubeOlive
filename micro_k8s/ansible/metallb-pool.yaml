apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: kubeflow-pool
  namespace: metallb-system
spec:
  addresses:
  - {{ metallb_ip_range }}
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: l2-advert
  namespace: metallb-system
spec:
  ipAddressPools:
  - kubeflow-pool
