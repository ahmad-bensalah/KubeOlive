---
# ============================================================
# COMMON ROLE — runs on every node (master + workers)
# ============================================================

# ---- prerequisites -----------------------------------------
- name: Ensure prerequisites are installed
  ansible.builtin.apt:
    name:
      - curl
      - ca-certificates
      - apt-transport-https
      - software-properties-common
      - gnupg
      - jq
      - snapd
      - iptables
    state: present
    update_cache: true

# ---- DNS ---------------------------------------------------
- name: Ensure resolved drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/resolved.conf.d
    state: directory
    mode: "0755"

- name: Configure DNS servers for systemd-resolved
  ansible.builtin.copy:
    dest: /etc/systemd/resolved.conf.d/dns_servers.conf
    mode: "0644"
    content: |
      [Resolve]
      DNS={{ network.dns_servers | join(' ') }}

- name: Restart systemd-resolved
  ansible.builtin.systemd:
    name: systemd-resolved
    state: restarted

# ---- /etc/hosts --------------------------------------------
- name: Ensure controlplane entry exists in /etc/hosts
  ansible.builtin.lineinfile:
    path: /etc/hosts
    line: "{{ controlplane.ip }} {{ controlplane.name }}"
    state: present

- name: Ensure worker entries exist in /etc/hosts
  ansible.builtin.lineinfile:
    path: /etc/hosts
    line: "{{ item.ip }} {{ item.name }}"
    state: present
  loop: "{{ workers }}"

# ---- swap --------------------------------------------------
- name: Disable swap immediately
  ansible.builtin.command: swapoff -a
  changed_when: false

- name: Comment out swap entries in /etc/fstab
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^(?!#)(.*\s+swap\s+.*)$'
    replace: '# \1'

# ---- kernel modules & sysctl --------------------------------
- name: Configure kernel modules for Kubernetes
  ansible.builtin.copy:
    dest: /etc/modules-load.d/k8s.conf
    mode: "0644"
    content: |
      overlay
      br_netfilter
      ipip

- name: Load overlay module
  ansible.builtin.modprobe:
    name: overlay
    state: present

- name: Load br_netfilter module
  ansible.builtin.modprobe:
    name: br_netfilter
    state: present

- name: Load ipip module
  ansible.builtin.modprobe:
    name: ipip
    state: present


- name: Configure sysctl params for Kubernetes networking
  ansible.builtin.copy:
    dest: /etc/sysctl.d/k8s.conf
    mode: "0644"
    content: |
      net.bridge.bridge-nf-call-iptables  = 1
      net.bridge.bridge-nf-call-ip6tables = 1
      net.ipv4.ip_forward                 = 1
      fs.inotify.max_user_instances       = 1280
      fs.inotify.max_user_watches         = 655360

- name: Apply sysctl params
  ansible.builtin.command: sysctl --system
  changed_when: false


# ---- Install MicroK8s ---------------------------------------
- name: Install MicroK8s via snap (v1.31)
  community.general.snap:
    name: microk8s
    classic: true
    channel: "1.31/stable"
  register: snap_install
  retries: 5
  delay: 10
  until: snap_install is success

# ---- User and Permissions ----------------------------------
- name: Add {{ vm_user }} user to microk8s group
  ansible.builtin.user:
    name: "{{ vm_user }}"
    groups: microk8s
    append: true

- name: Change ownership of default snap/microk8s directories
  ansible.builtin.file:
    path: /home/{{ vm_user }}/.kube
    state: directory
    owner: "{{ vm_user }}"
    group: "{{ vm_user }}"
    mode: "0755"

# ---- Wait for MicroK8s to be ready --------------------------
- name: Wait for MicroK8s to start and be ready
  ansible.builtin.command: microk8s status --wait-ready
  changed_when: false

# ---- Trust GitLab container registry (insecure HTTP) ------------------------
# MicroK8s uses containerd. We configure its hosts.toml so that all nodes
# can pull images from the GitLab registry at http://{{ gitlab_ip }}:5050
# without TLS errors.
# The directory path follows containerd's per-registry host config layout:
#   /var/snap/microk8s/current/args/certs.d/<host:port>/hosts.toml
- name: Create containerd registry config directory for GitLab registry
  ansible.builtin.file:
    path: /var/snap/microk8s/current/args/certs.d/{{ gitlab_ip }}:5050
    state: directory
    mode: "0755"

- name: Configure containerd to trust GitLab registry over HTTP
  ansible.builtin.copy:
    dest: /var/snap/microk8s/current/args/certs.d/{{ gitlab_ip }}:5050/hosts.toml
    mode: "0644"
    content: |
      # GitLab Container Registry — plain HTTP (internal LAN)
      server = "http://{{ gitlab_ip }}:5050"

      [host."http://{{ gitlab_ip }}:5050"]
        capabilities = ["pull", "resolve", "push"]
        skip_verify   = true
  register: registry_containerd_config

- name: Restart MicroK8s to apply containerd registry config
  ansible.builtin.command: snap restart microk8s
  when: registry_containerd_config.changed
  changed_when: true

- name: Wait for MicroK8s to be ready after containerd config change
  ansible.builtin.command: microk8s status --wait-ready
  when: registry_containerd_config.changed
  changed_when: false

# ---- Shell Aliases -----------------------------------------
- name: Add kubectl and helm aliases to {{ vm_user }} .bashrc
  ansible.builtin.lineinfile:
    path: /home/{{ vm_user }}/.bashrc
    line: "alias {{ item.key }}='{{ item.value }}'"
    state: present
  loop:
    - { key: "kubectl", value: "microk8s kubectl" }
    - { key: "helm", value: "microk8s helm" }

- name: Add kubectl and helm aliases to root .bashrc
  ansible.builtin.lineinfile:
    path: /root/.bashrc
    line: "alias {{ item.key }}='{{ item.value }}'"
    state: present
  loop:
    - { key: "kubectl", value: "microk8s kubectl" }
    - { key: "helm", value: "microk8s helm" }
