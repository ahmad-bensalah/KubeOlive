---
# ==============================================================================
# GITLAB ROLE — Install GitLab CE & Register Kubeflow OAuth Application
# ==============================================================================
# This role installs GitLab Community Edition on a dedicated VM and creates an
# OAuth2 application inside GitLab. This OAuth app allows Kubeflow's Dex identity
# provider to authenticate users via GitLab's "Login with GitLab" button.
#
# The OAuth credentials (client_id, client_secret) are fetched from the GitLab
# server and stored locally so the Juju role can configure Dex with them.

# ---- Prerequisites -----------------------------------------------------------
# Install system packages that GitLab depends on:
#   - curl: used by the GitLab repo setup script
#   - openssh-server: GitLab uses SSH for git operations
#   - ca-certificates: TLS certificate validation
#   - tzdata: timezone data for log timestamps
#   - perl: required by some GitLab internal scripts
#   - postfix: local mail transport agent for GitLab email notifications
- name: Install GitLab prerequisites
  ansible.builtin.apt:
    name:
      - curl
      - openssh-server
      - ca-certificates
      - tzdata
      - perl
      - postfix
    state: present
    update_cache: true

# Pre-configure postfix to avoid interactive prompts during apt install.
# We set it to "Internet Site" mode which delivers mail using the system's FQDN.
- name: Configure postfix to use local delivery (non-interactive)
  ansible.builtin.debconf:
    name: postfix
    question: postfix/main_mailer_type
    value: "Internet Site"
    vtype: string

# ---- Add GitLab Repository --------------------------------------------------
# GitLab is not in the default Ubuntu repos. We add their official apt repository
# by running their setup script. The 'stat' check ensures idempotency — we only
# run the script if the repo file doesn't exist yet.
- name: Check if GitLab apt repo is already configured
  ansible.builtin.stat:
    path: /etc/apt/sources.list.d/gitlab_gitlab-ce.list
  register: gitlab_repo_stat

- name: Download and run GitLab repository script
  ansible.builtin.shell:
    cmd: curl -sS https://packages.gitlab.com/install/repositories/gitlab/gitlab-ce/script.deb.sh | bash
  when: not gitlab_repo_stat.stat.exists
  args:
    creates: /etc/apt/sources.list.d/gitlab_gitlab-ce.list

# ---- Install GitLab CE ------------------------------------------------------
# Install GitLab CE via apt. We set EXTERNAL_URL as an environment variable
# during installation — GitLab reads this to configure Nginx's server_name
# and the URLs displayed in the web UI. We use the VM's IP address since
# we don't have a DNS name for this internal server.
- name: Check if GitLab CE is already installed
  ansible.builtin.command: dpkg-query -W gitlab-ce
  register: gitlab_installed
  failed_when: false
  changed_when: false

- name: Install GitLab CE
  ansible.builtin.apt:
    name: gitlab-ce
    state: present
    update_cache: true
  environment:
    EXTERNAL_URL: "http://{{ ansible_host }}"
  when: gitlab_installed.rc != 0

# ---- Configure GitLab -------------------------------------------------------
# Ensure the external_url in gitlab.rb matches the VM's IP address. This is
# important because GitLab uses this URL for all internal links, OAuth redirect
# URIs, and webhook callbacks.
- name: Configure GitLab external URL
  ansible.builtin.lineinfile:
    path: /etc/gitlab/gitlab.rb
    regexp: "^external_url"
    line: "external_url 'http://{{ ansible_host }}'"
    state: present
  register: gitlab_config_changed

# Fix CSRF token race condition by using single-worker Puma mode.
# With multiple Puma workers, NGINX round-robins requests between them, which
# causes CSRF validation failures when concurrent login attempts happen because
# the form token generated by worker A is validated by worker B.
- name: Configure Puma and session settings to prevent CSRF issues
  ansible.builtin.blockinfile:
    path: /etc/gitlab/gitlab.rb
    marker: "# {mark} ANSIBLE MANAGED: Puma single-worker mode"
    block: |
      # Single-worker Puma to avoid cross-worker CSRF race conditions.
      puma['worker_processes'] = 0
      puma['min_threads'] = 1
      puma['max_threads'] = 8

      # Trust the Kubeflow/Istio ingress and pod CIDRs as reverse proxies.
      # Without this, Rails sees forwarded OAuth requests as coming from
      # 127.0.0.1 and the Origin header check that backs CSRF validation fails.
      gitlab_rails['trusted_proxies'] = ['{{ vm_subnet }}', '172.16.0.0/16', '172.17.0.0/18']
    state: present
  register: puma_config_changed

# 'gitlab-ctl reconfigure' applies all configuration changes. It reconfigures
# Nginx, PostgreSQL, Redis, Puma, and all other GitLab components. This can
# take up to 10 minutes, hence the async timeout of 600 seconds.
- name: Reconfigure GitLab if configuration changed
  ansible.builtin.command: gitlab-ctl reconfigure
  when: gitlab_config_changed.changed or puma_config_changed.changed
  async: 600
  poll: 15

# ---- Wait for GitLab to be fully operational ---------------------------------
# GitLab takes time to fully initialize after reconfigure. We wait for port 80
# (Nginx) to become available, then add an extra 30-second buffer for internal
# services (Puma, Sidekiq) to finish their initialization sequences.
- name: Wait for GitLab Rails to be ready
  ansible.builtin.wait_for:
    host: "{{ ansible_host }}"
    port: 80
    timeout: 300
    delay: 30

- name: Wait extra time for GitLab internal services to initialize
  ansible.builtin.pause:
    seconds: 30

# ---- Create Kubeflow OAuth Application ---------------------------------------
# We use 'gitlab-rails runner' to execute Ruby code directly inside GitLab's
# Rails console. This is more reliable than using the GitLab REST API because
# it doesn't require an admin token and runs with full database access.

# Idempotency check: see if the OAuth app 'Kubeflow Dex' already exists.
- name: Check if Kubeflow Dex OAuth app already exists
  ansible.builtin.command: >
    gitlab-rails runner
    "puts Doorkeeper::Application.where(name: 'Kubeflow Dex').exists?"
  register: oauth_app_exists
  changed_when: false

# Create the OAuth2 application using GitLab's Doorkeeper (OAuth provider).
# - redirect_uri: The URL that GitLab will redirect to after successful login.
#   It MUST match the Dex callback endpoint exactly (including the nip.io domain).
# - scopes: 'openid profile email read_user' — Dex needs these to extract
#   the user's identity (email, name) from GitLab's userinfo endpoint.
# - confidential: true — the app uses a client_secret (server-side flow).
# The generated client_id and client_secret are written to a temp JSON file.
- name: Create Kubeflow Dex OAuth application in GitLab
  ansible.builtin.shell:
    cmd: |
      gitlab-rails runner "
        org = nil
        if defined?(Organizations::Organization)
          org = Organizations::Organization.first
        end
        org_id = org ? org.id : 1

        app = Doorkeeper::Application.find_by(name: 'Kubeflow Dex')
        if app.nil?
          app = Doorkeeper::Application.new(
            name:            'Kubeflow Dex',
            redirect_uri:    'http://{{ kubeflow_dashboard_ip }}/dex/callback',
            scopes:          'openid profile email read_user',
            confidential:    true,
            organization_id: org_id
          )
          app.save!
        end
        File.write('/tmp/gitlab_oauth_creds.json',
          { client_id: app.uid, client_secret: app.secret }.to_json
        )
        STDOUT.flush
      "
  register: oauth_creation
  changed_when: oauth_creation.rc == 0

# Fetch the OAuth credentials JSON file from the GitLab VM to the Ansible
# controller's local filesystem. This file will be read by the Juju play
# using Ansible's 'lookup("file")' function to configure Dex connectors.
- name: Fetch GitLab OAuth credentials file
  ansible.builtin.fetch:
    src: /tmp/gitlab_oauth_creds.json
    dest: "{{ playbook_dir }}/configs/gitlab_oauth_creds.json"
    flat: true

# Load the credentials into an Ansible variable so they can be passed to
# the Juju role. We run this on localhost (the Ansible controller) because
# that's where the file was fetched to.
- name: Read GitLab OAuth credentials into Ansible variables
  ansible.builtin.set_fact:
    gitlab_oauth_creds: "{{ lookup('file', playbook_dir + '/configs/gitlab_oauth_creds.json') | from_json }}"
  delegate_to: localhost
  become: false

# Display the client_id for operator verification in the Ansible output log.
- name: Show GitLab OAuth client_id (for verification)
  ansible.builtin.debug:
    msg: "GitLab OAuth App created — client_id: {{ gitlab_oauth_creds.client_id }}"

# ---- Deploy Admin Portal ----------------------------------------------------
# Include the portal.yml tasks which deploy the multi-user Admin Portal web app
# on the same GitLab VM. The portal provides a UI for creating Kubeflow user
# namespaces and replicating MinIO secrets into them.
- name: Include Portal provisioning tasks
  ansible.builtin.include_tasks: portal.yml
  tags:
    - portal

# ---- Enable Container Registry ----------------------------------------------
# Include the registry.yml tasks which enable GitLab's built-in container
# registry on port 5050 (plain HTTP for internal LAN deployments).
- name: Include Container Registry provisioning tasks
  ansible.builtin.include_tasks: registry.yml
  tags:
    - registry
