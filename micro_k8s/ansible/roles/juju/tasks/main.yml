# ── Final status check ────────────────────────────────────────────────────────
- name: Wait for mlflow-server to reach active/idle after all integrations
  tags: [mlflow]
  ansible.builtin.shell: >
    sudo -u {{ vm_user }} -i juju status -m kubeflow --format=json
    | jq -r '.applications["mlflow-server"]["application-status"].current'
  register: mlflow_final
  until: mlflow_final.stdout == 'active'
  retries: 40
  delay: 15
  changed_when: false
  failed_when: false

- name: MLflow deployment complete
  tags: [mlflow]
  ansible.builtin.debug:
    msg:
      - "MLflow tracking UI : {{ kubeflow_dashboard_url }}/mlflow"
      - "MLflow appears in the Kubeflow dashboard left navigation"
      - "MLFLOW_TRACKING_URI is auto-injected into notebook pods via PodDefault"
      - "Reloader ensures pods restart when MLflow S3 credentials rotate"
